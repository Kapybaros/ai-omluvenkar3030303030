version: "3.9"

services:

  # ── 1. PostgreSQL – the database ────────────────────────────────────────────
  db:
    image: postgres:16-alpine         # Small, official Postgres image
    container_name: excuse_db
    environment:
      POSTGRES_DB:       excuses      # Database name
      POSTGRES_USER:     student      # Username
      POSTGRES_PASSWORD: tajneheslo   # Password ("secret password" in Czech 😄)

    networks:
      - excuse_net
    restart: unless-stopped
    # Health check: wait until Postgres is actually ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d excuses"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ── 3. Flask web app – the AI Omluvenkář ────────────────────────────────────
  web:
    build: .
    container_name: excuse_web
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      # LLM Model setup for production
      - OPENAI_API_KEY=sk-420B08-tK1FKX69UbVB3DA
      - OPENAI_BASE_URL=https://kurim.ithope.eu/v1
      - MODEL_NAME=gemma3:27b
      # PostgreSQL connection details
      - DB_PORT=5432
      - DB_NAME=excuses
      - DB_USER=student
      - DB_PASS=tajneheslo
    depends_on:
      db:
        condition: service_healthy   # Wait for Postgres health check to pass
    networks:
      - excuse_net
    restart: unless-stopped

# ── Shared network ───────────────────────────────────────────────────────────
networks:
  excuse_net:
    driver: bridge

